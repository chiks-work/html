<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .header
    {
        border: 1px solid black;
        height: 50px;
        font-size: 50px;
        text-align: center;
        background-color: red;
    }
    .main
    {
        border: 1px solid black;
        height: 400px;
        
    }
    .left
    {
        -border: 1px solid black;
        height: 100%;
        width: 50%;
        float: left;
        background-color: green;
        font-size: 50px;
    }
    .right
    {
        -border: 1px solid black;
        height: 100%;
        width: 50%;
        float: left;
        background-color: blue;
        font-size: 50px;
    }
    .footer
    {
        border: 1px solid black;
        height: 50px;
        font-size: 50px;
        text-align: center;
        background-color: yellow;
    }
    @media(max-width:400px)
    {
        .header
        {
           background-color: #131D4F;
        }
        .left
        {
            background-color:#A0C878 ;
        }
        .right
        {
            background-color: #8D0B41;
        }
        .footer
        {
            background-color: #D8A25E;
        }
    }
</style>
<body>
    <div class="header">header</div>
    <div class="main">
        <div class="left">left</div>
        <div class="right">right</div>
    </div>
    <div class="footer">footer</div>
</body>
</html>
