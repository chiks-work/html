<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- IMPORTANT for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Home Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Header */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* Navigation */
        nav {
            background-color: #34495e;
            padding: 10px;
            text-align: center;
        }

        nav a {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin: 5px 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: yellow;
        }

        /* Main content */
        .content {
            padding: 20px;
            text-align: center;
        }

        p {
            color: orange;
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        /* 📱 MOBILE RESPONSIVE CSS */
        @media (max-width: 600px) {

            header h1 {
                font-size: 22px;
            }

            nav a {
                display: block;
                margin: 10px 0;
            }

            .content h2 {
                font-size: 20px;
            }

            p {
                font-size: 14px;
            }

            footer {
                position: static;
                /* remove fixed footer on mobile */
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Welcome to My Website</h1>
        <p>This is my home page</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main Content -->
    <div class="content">
        <h2>Hello!</h2>
        <p>This is a simple HTML home page example.</p>
        <p>You can customize it as you like.</p>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Website | All Rights Reserved</p>
    </footer>

</body>

</html>
