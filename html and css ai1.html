<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #ffffff;
            padding: 30px;
            width: 320px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-box label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-box button {

            padding: 10px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-box button:hover {
            background: #555;
        }

        .login-box .links {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-box .links a {
            color: #333;
            text-decoration: none;
        }

        .login-box .links a:hover {
            text-decoration: underline;
        }


        button[type="submit"] {
            width: 340px;
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>Login</h2>
        <form>
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">

            <button type="submit">Log In</button>
        </form>
        <div class="links">
            <a href="#">Forgot password?</a>
        </div>
    </div>
</body>

</html>
