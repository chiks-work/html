<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .header
    {
        -border: 1px solid black;
        height: 70px;
        background-color: #E52020;
        font-size: 40px;
        text-align: center;
        padding-top: 20px;
        color: white;
    }
    .menu
    {
        -border: 1px solid black;
        -height: 50px;
        padding: 40px;
        background-color: darkgray;
    }
    a
    {
        margin-left: 40px;
        color: white;
        font-size:20px;
    }
    .main
    {
        -border: 1px solid black;
        height: 400px;

    }
    .left,.right
    {
        -border: 1px solid black;
        height: 100%;
        width: 50%;
        float: left;
        
    }
   
    .left
    {
        background-color: #B82132;
    }
     h1
    {
        text-align: center;
        margin-top: 30%;
    }
    .right
    {
       background-color: #E5D0AC;
    }
    h4
    {
        text-align: center;
        margin-top: 30%;
    }
    .footer
    {
        -border: 1px solid black;
        background-color: #E52020;
        text-align: center;
        -height: 50px;
        padding-block: 30px;
        
    }
    p
    {
        margin: 0px;
    }
</style>
<body>
    <div class="header">Layout Example</div>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Service</a>
        <a href="#">Contact Us</a>
    </div>
    <div class="main">
        <div class="left">
            <h1>Hello World!!</h1>
        </div>
        <div class="right"><h4>How are you today?</h4></div>
    </div>
    <div class="footer">
        <p>CopyrightW3spoint.com</p>
    </div>
</body>
</html>
